name: Node tests

on:
  push:
    branches:
      - main
      - feat/m1-preference-memory
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: node-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
