name: Node tests

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install DSH host-only test dependencies
        run: npm install --no-save @deepseek-ai/schemastery yaml
      - name: Run tests with isolated memory directory
        run: |
          export DY_MEMORY_DIR="$(mktemp -d)"
          npm test
